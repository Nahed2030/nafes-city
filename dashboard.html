<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الطالبة | نافس</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f5f8ff;
padding:20px;
}

.header{
background:linear-gradient(135deg,#2b2d9c,#00b4d8);
color:white;
padding:30px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin-bottom:10px;
}

.progress{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:20px;
}

.bar{
height:20px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.fill{
width:15%;
height:100%;
background:linear-gradient(90deg,#00b4d8,#2b2d9c);
}

.buttons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.btn{
background:#2b2d9c;
color:white;
padding:20px;
border-radius:16px;
text-align:center;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<h1>🌆 نافس | مدينة الشغف والإنجاز</h1>

<p>لوحة الطالبة الرئيسية</p>

</div>

<div class="cards">

<div class="card">
<h3>🏆 الرتبة</h3>
<p>مستكشفة</p>
</div>

<div class="card">
<h3>⭐ النقاط</h3>
<p>150</p>
</div>

<div class="card">
<h3>🎖 الأوسمة</h3>
<p>3</p>
</div>

<div class="card">
<h3>📚 الاختبارات</h3>
<p>1 من 43</p>
</div>

</div>

<div class="progress">

<h3>📈 التقدم العام</h3>

<div class="bar">
<div class="fill"></div>
</div>

</div>

<div class="buttons">

<a class="btn" href="#">
📚 الاختبارات المحاكية
</a>

<a class="btn" href="#">
🎮 الألعاب التعليمية
</a>

<a class="btn" href="#">
🏆 الإنجازات
</a>

<a class="btn" href="#">
✨ نبض
</a>

</div>

</body>
</html>
