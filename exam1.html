<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاختبار المحاكي الأول | نافس</title>

<style>

body{
font-family:Tahoma,sans-serif;
background:#f5f8ff;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
color:#2b2d9c;
text-align:center;
}

.question{
margin-top:25px;
font-size:22px;
}

.option{
display:block;
padding:12px;
margin:10px 0;
background:#eef2ff;
border-radius:10px;
cursor:pointer;
}

button{
background:#2b2d9c;
color:white;
border:none;
padding:15px 25px;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

#result{
margin-top:20px;
font-size:24px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>📚 الاختبار المحاكي الأول</h1>

<div class="question">
ما الجزء المسؤول عن إنتاج الطاقة في الخلية؟
</div>

<label class="option">
<input type="radio" name="q1" value="0">
 الغشاء البلازمي
</label>

<label class="option">
<input type="radio" name="q1" value="1">
 الميتوكندريا
</label>

<label class="option">
<input type="radio" name="q1" value="0">
 النواة
</label>

<label class="option">
<input type="radio" name="q1" value="0">
 الريبوسومات
</label>

<button onclick="checkAnswer()">
إرسال الإجابة
</button>

<div id="result"></div>

</div>

<script>

function checkAnswer(){

let answer=document.querySelector('input[name="q1"]:checked');

if(!answer){
document.getElementById("result").innerHTML="⚠️ اختاري إجابة أولاً";
return;
}

if(answer.value=="1"){
document.getElementById("result").innerHTML="✅ إجابة صحيحة";
}
else{
document.getElementById("result").innerHTML="❌ إجابة غير صحيحة";
}

}

</script>

</body>
</html>
